components:
  schemas:
    PostEmailsRequest:
      type: object
      properties:
        Options:
          type: object
          description: Object containing optional parameters for the email request.
        ChannelName:
          type: string
          description: Name of the channel to send the email through. If the channel does not exist it will be created.
    PostHooksElasticRequest:
      type: object
      properties:
        X-ElasticEmail-Timestamp:
          type: string
          description: Unix time when request was sent
        X-ElasticEmail-Signature:
          type: string
          description: Signature in form v1=<hex>
        X-ElasticEmail-Webhook-Id:
          type: string
          description: ID of the webhook
        body:
          type: string
          description: Event data as flat JSON object
      required:
      - X-ElasticEmail-Timestamp
      - X-ElasticEmail-Signature
      - X-ElasticEmail-Webhook-Id
      - body
    PostHooksElasticResponse:
      type: object
      properties:
        '200':
          type: string
          description: Successful verification
        '401':
          type: string
          description: Signature verification failed
    PostV4WebhookRequest:
      type: object
      properties:
        Name:
          type: string
          description: Webhook name
        URL:
          type: string
          description: Endpoint URL (https://)
        NotificationForSent:
          type: boolean
          description: Whether to receive sent notifications
        NotificationForError:
          type: boolean
          description: Whether to receive error notifications
        EnableSigning:
          type: boolean
          description: Enable request signing (default false)
        DeliveryMethod:
          type: string
          description: Delivery method, either Get (default) or PostJson
      required:
      - Name
      - URL
    PostV4WebhookResponse:
      type: object
      properties:
        SigningEnabled:
          type: boolean
          description: Whether signing is enabled
        DeliveryMethod:
          type: string
          description: Delivery method set for the webhook
        SigningSecret:
          type: string
          description: Secret starting with whsec_, only returned on creation
    PostV4WebhookIdSecretRotateResponse:
      type: object
      properties:
        SigningSecret:
          type: string
          description: New secret, starts with whsec_
tags:
- name: Api
- name: Emails
- name: Hooks
- name: Webhook
